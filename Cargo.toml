[package]
name = "bauhaus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
